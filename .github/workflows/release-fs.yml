# Build + verify the prebuilt flash filesystem image, and attach it to a
# GitHub Release on tag pushes.
#
# What it does:
#   1. Builds the dashboard (ui/ -> www/) so the bundle always matches source.
#   2. Stages the exact device tree deploy.ps1 ships:
#        /main.py /boot.py /app/* /www/* /lib/microdot/*
#      (no config.yaml, no /opt/data — device state is created at first boot)
#   3. Packs it with mklittlefs (built from source) into a 14 MB image for the
#      MicroPython `vfs` partition (flash offset 0x200000, size 0xE00000 —
#      read from the board via esp32.Partition; matches /api/stats fs_total).
#   4. Verifies by mounting the image with littlefs-python (the same
#      littlefs format family the board reads) and comparing every file by
#      name AND bytes. (`mklittlefs -l` is NOT used for this: its listing
#      display mangles nested paths even though the image is correct.)
#   5. Branch pushes auto-tag the next semver from the commit message, and the
#      SAME run publishes talaria-fs-<tag>.bin + SHA256 as a Release (a tag
#      push made with GITHUB_TOKEN cannot start a new run by GitHub design,
#      so no second run is relied on). Tag pushes (manual) skip auto-tag and
#      build + publish directly.
#
# Install from a release (esptool only, no Python/mpremote/npm needed):
#   esptool --chip esp32s3 --port COM11 --baud 460800 erase_flash
#   esptool --chip esp32s3 --port COM11 --baud 460800 write_flash -z 0 ESP32_GENERIC_S3-SPIRAM_OCT-<ver>.bin
#   esptool --chip esp32s3 --port COM11 --baud 460800 write_flash 0x200000 talaria-fs-vX.Y.Z.bin
name: Filesystem image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FS_SIZE: "14680064" # 0xE00000 — vfs partition size on 16 MB flash boards
  FS_OFFSET: "0x200000" # vfs partition address (esp32.Partition, label 'vfs')

jobs:
  build-fs:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags for auto-versioning

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build dashboard bundle (ui/ -> www/)
        run: |
          cd ui
          npm ci
          npm run build

      - name: Auto-tag release version
        # Branch pushes only — tag-triggered runs skip this, so there is no
        # loop. NOTE: this push uses GITHUB_TOKEN, which never triggers new
        # runs by design, so the release is published by THIS run below
        # (see Publish step) instead of relying on a second tag run.
        if: github.ref_type == 'branch'
        id: autotag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          MSG=$(git log -1 --pretty=%B)
          if echo "$MSG" | grep -qE 'BREAKING CHANGE:|^major(\([^)]*\))?:'; then
            PART=major
          elif echo "$MSG" | grep -qE '^feat(\([^)]*\))?:|^feature(\([^)]*\))?:|^minor(\([^)]*\))?:'; then
            PART=minor
          else
            PART=patch
          fi
          LAST=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo v0.0.0)
          VER=${LAST#v}
          MAJOR=${VER%%.*}; REST=${VER#*.}
          MINOR=${REST%%.*}; PATCH=${REST#*.}
          case "$PART" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="v$MAJOR.$MINOR.$PATCH"
          for _ in 1 2 3; do
            if git ls-remote --tags origin "refs/tags/$NEXT" | grep -q "refs/tags/$NEXT$"; then
              PATCH=$((PATCH + 1)); NEXT="v$MAJOR.$MINOR.$PATCH"
            else
              break
            fi
          done
          echo "Commit calls for a $PART bump ($LAST -> $NEXT)"
          PUSHED=""
          for _ in 1 2 3; do
            git tag "$NEXT" 2>/dev/null || true
            if git push origin "$NEXT"; then PUSHED=1; break; fi
            git fetch --tags --force -q
            PATCH=$((PATCH + 1)); NEXT="v$MAJOR.$MINOR.$PATCH"
          done
          if [ -z "$PUSHED" ]; then echo "tag push failed"; exit 1; fi
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Stage device tree
        run: |
          rm -rf staging
          mkdir -p staging/app/tools staging/www/assets staging/lib/microdot
          cp main.py boot.py staging/
          cp app/*.py staging/app/
          cp app/tools/*.py app/tools/*.sample app/tools/README.md staging/app/tools/
          cp www/index.html www/favicon.svg staging/www/
          cp www/assets/app.js www/assets/app.css www/assets/app.js.gz www/assets/app.css.gz staging/www/assets/
          for f in __init__.py microdot.py multipart.py helpers.py; do
            curl -fsSL "https://raw.githubusercontent.com/miguelgrinberg/microdot/main/src/microdot/$f" -o "staging/lib/microdot/$f"
          done
          echo "--- staged tree ---"
          (cd staging && find . -type f | sort)

      - name: Build mklittlefs from source
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/earlephilhower/mklittlefs.git
          make -C mklittlefs -j"$(nproc)"
          ls mklittlefs/mklittlefs

      - name: Pack filesystem image
        run: |
          ./mklittlefs/mklittlefs -c staging -s "$FS_SIZE" -b 4096 -p 256 talaria-fs.bin
          ls -l talaria-fs.bin

      - name: Verify image contents against staging
        run: |
          pip install littlefs-python
          python3 scripts/verify_fs_image.py talaria-fs.bin staging

      - name: Resolve release tag
        # Tag runs release their own tag; branch runs release the auto-tag.
        id: rel
        if: github.ref_type == 'tag' || steps.autotag.outputs.tag != ''
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ steps.autotag.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Name + checksum release files
        if: steps.rel.outputs.tag != ''
        run: |
          cp talaria-fs.bin "talaria-fs-${{ steps.rel.outputs.tag }}.bin"
          sha256sum "talaria-fs-${{ steps.rel.outputs.tag }}.bin" > "talaria-fs-${{ steps.rel.outputs.tag }}.bin.sha256"
          cat "talaria-fs-${{ steps.rel.outputs.tag }}.bin.sha256"

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: talaria-fs
          path: talaria-fs.bin
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: |
            talaria-fs-v*.bin
            talaria-fs-v*.bin.sha256
          generate_release_notes: false
          body: |
            Prebuilt flash filesystem for Talaria Agent (`${{ steps.rel.outputs.tag }}`).

            No Python, mpremote, or npm needed — esptool only:

            ```
            esptool --chip esp32s3 --port COM11 --baud 460800 erase_flash
            esptool --chip esp32s3 --port COM11 --baud 460800 write_flash -z 0 ESP32_GENERIC_S3-SPIRAM_OCT-<ver>.bin
            esptool --chip esp32s3 --port COM11 --baud 460800 write_flash 0x200000 talaria-fs-${{ steps.rel.outputs.tag }}.bin
            ```

            - `ESP32_GENERIC_S3-SPIRAM_OCT-*.bin`: MicroPython for ESP32-S3 with octal PSRAM, from https://micropython.org/download/ESP32_GENERIC_S3 (flash at offset `0`).
            - `talaria-fs-*.bin` (this asset): `/main.py`, `/boot.py`, `/app/*`, `/www/*`, `/lib/microdot/*` packed with littlefs for the `vfs` partition (offset `0x200000`, size 14 MB). First boot creates the open `Talaria-Agent-Setup` network — join it and the setup page walks you through WiFi + provider.
            - Verify the download: `sha256sum talaria-fs-*.bin` against `talaria-fs-*.bin.sha256` below (generated at release time).
