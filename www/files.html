<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
a{text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #8884;flex:none;position:relative}
header h1{font-size:16px;margin:0;line-height:1.2;flex:none}nav.topnav{display:flex;align-items:center;position:static}.navlinks{display:flex;align-items:center}.navlinks a{margin-left:10px;font-size:13px;line-height:1.2}
header nav.topnav{display:flex;align-items:center}
nav a.active{font-weight:700}
#themebtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin-left:10px;border:1px solid #8884;border-radius:8px;background:transparent;color:inherit;cursor:pointer;padding:0;flex:none}
#themebtn:hover{background:#8882}
#themebtn svg{width:16px;height:16px}
#themebtn .sun{display:none}
html[data-theme="dark"] #themebtn .sun{display:block}
html[data-theme="dark"] #themebtn .moon{display:none}
html[data-theme="light"]{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="light"] body{background:#fff;color:#111}
html[data-theme="dark"] body{background:#0f141b;color:#e6e8ee}
html[data-theme="dark"] a{color:#8ab4ff}
/* Explorer command bar */
#cmdbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid #8884;flex:none;flex-wrap:wrap}
.nbtn{border:1px solid #8884;background:transparent;color:inherit;border-radius:8px;min-width:30px;height:30px;padding:0 8px;cursor:pointer;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.nbtn:hover:not(:disabled){background:#8882}
.nbtn:disabled{opacity:.35;cursor:default}
#crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:200px;border:1px solid #8884;border-radius:8px;padding:3px 6px;overflow-x:auto;white-space:nowrap}
#crumbs button{border:0;background:transparent;color:inherit;cursor:pointer;font:inherit;font-size:13px;padding:4px 6px;border-radius:6px;white-space:nowrap}
#crumbs button:hover{background:#0b6cff22}
#crumbs button.cur{font-weight:700}
#crumbs .sep{opacity:.4;font-size:12px}
#search{border:1px solid #8884;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;background:transparent;color:inherit;width:180px}
.tbtn{border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;background:#0b6cff;color:#fff}
.tbtn.ghost{background:#8882;color:inherit}
.tbtn.ghost:hover{background:#8883}
.tbtn:disabled{opacity:.5;cursor:default}
/* Main explorer split — full browser width, no centred column */
#explorer{flex:1;display:flex;min-height:0;width:100%}
#sidebar{width:220px;flex:none;border-right:1px solid #8884;overflow-y:auto;padding:10px 6px;font-size:13px}
#sidebar h4{margin:8px 8px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.55}
#sidebar button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:inherit;cursor:pointer;font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;text-align:left}
#sidebar button:hover{background:#8882}
#sidebar button.cur{background:#0b6cff22;font-weight:600}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#listwrap{flex:1;overflow:auto;min-height:120px}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{position:sticky;top:0;background:Canvas;text-align:left;font-size:12px;padding:8px 10px;border-bottom:1px solid #8884;cursor:pointer;user-select:none;white-space:nowrap;z-index:2}
thead th:hover{color:#0b6cff}
tbody td{padding:7px 10px;border-bottom:1px solid #8882;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
tbody tr{cursor:pointer}
tbody tr:hover{background:#8881}
tbody tr.sel{background:#0b6cff1c}
td.namecell{display:flex;align-items:center;gap:8px}
td.namecell .ico{flex:none;width:20px;text-align:center}
td.namecell .nm{overflow:hidden;text-overflow:ellipsis}
.rowbtns{display:flex;gap:4px}
.rowbtns button{border:1px solid #8884;background:transparent;color:inherit;border-radius:6px;font-size:11px;padding:3px 8px;cursor:pointer}
.rowbtns button:hover{background:#0b6cff;color:#fff;border-color:#0b6cff}
#statusbar{flex:none;display:flex;justify-content:space-between;gap:10px;padding:6px 12px;border-top:1px solid #8884;font-size:12px;opacity:.85}
#details{flex:none;width:250px;border-left:1px solid #8884;padding:12px;overflow-y:auto;font-size:13px}
#details h3{margin:0 0 8px;font-size:14px;word-break:break-all}
#details dl{margin:0 0 10px}
#details dt{font-size:11px;opacity:.6;margin-top:8px}
#details dd{margin:2px 0 0;word-break:break-all}
#details .dbtns{display:flex;flex-direction:column;gap:6px;margin-top:10px}
/* Editor pane — same window, right side */
#editor{flex:none;width:min(46vw,720px);min-width:340px;border-left:1px solid #8884;display:none;flex-direction:column;min-height:0;background:Canvas}
#editor.open{display:flex}
#edbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #8884;flex:none;position:relative}
#edbar .fn{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#langbadge{font-size:11px;font-weight:700;border:1px solid #8884;border-radius:6px;padding:2px 7px;opacity:.8;flex:none}
#dirtydot{width:8px;height:8px;border-radius:50%;background:#f5a623;display:none;flex:none}
#edwrap{flex:1;position:relative;min-height:0;display:flex}
#gutter{flex:none;width:46px;overflow:hidden;text-align:right;padding:12px 8px 12px 0;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.55;opacity:.45;user-select:none;background:#8881}
#codebox{flex:1;position:relative;min-width:0}
#hl,#ta{margin:0;padding:12px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.55;white-space:pre;tab-size:4}
#hl{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#hl code{font:inherit}
#ta{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:transparent;caret-color:#0b6cff;overflow:auto}
html[data-theme="dark"] #ta{caret-color:#8ab4ff}
/* syntax colours */
.tok-k{color:#c678dd;font-weight:600}
.tok-s{color:#98c379}
.tok-c{color:#7f848e;font-style:italic}
.tok-n{color:#d19a66}
.tok-f{color:#61afef}
.tok-t{color:#e5c07b}
.tok-b{color:#56b6c2}
html[data-theme="light"] .tok-k{color:#a626a4}
html[data-theme="light"] .tok-s{color:#22863a}
html[data-theme="light"] .tok-c{color:#969896}
html[data-theme="light"] .tok-n{color:#b45a00}
html[data-theme="light"] .tok-f{color:#0550ae}
html[data-theme="light"] .tok-t{color:#8250df}
html[data-theme="light"] .tok-b{color:#0a7ea4}
#edstatus{flex:none;padding:5px 12px;border-top:1px solid #8884;font-size:12px;opacity:.8;min-height:26px}
#msg{flex:none;padding:4px 12px;font-size:12px;color:#c0392b;min-height:20px}
/* in-page modal dialogs (native alert/confirm/prompt are banned app-wide) */
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:120;padding:16px}
.modal.open{display:flex}
.modalcard{background:Canvas;color:inherit;border:1px solid #8885;border-radius:14px;box-shadow:0 18px 50px #0008;padding:18px;max-width:380px;width:100%}
.modalcard h3{margin:0 0 8px;font-size:16px;line-height:1.25}
.modalcard p{margin:0 0 12px;font-size:13px;line-height:1.5;opacity:.85;white-space:pre-wrap;word-break:break-word}
.modalcard input{width:100%;padding:10px;border-radius:8px;border:1px solid #8888;font:inherit;font-size:14px;background:transparent;color:inherit;margin-bottom:12px;box-sizing:border-box}
.modalbtns{display:flex;justify-content:flex-end;gap:8px}
.modalbtns .tbtn{padding:8px 14px;font-size:13px}
.tbtn.danger{background:#c0392b}
.tbtn.danger:hover{background:#a93226}
html[data-theme="dark"] .modalcard{background:#161c26;border-color:#ffffff22}
html[data-theme="dark"] .modalcard input{background:#1a2230;border-color:#ffffff2a;color:#e6e8ee}
@media(max-width:900px){
  #sidebar{display:none}
  #details{display:none}
  #editor{width:100%;min-width:0}
  #search{width:110px}
}
#consolebtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin-left:10px;border:1px solid #8884;border-radius:8px;background:transparent;color:inherit;cursor:pointer;padding:0;flex:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:700}
#consolebtn:hover{background:#8882}
#consoledrawer{position:fixed;left:0;right:0;bottom:0;z-index:300;display:none;flex-direction:column;height:min(48vh,430px);background:#0d1117;color:#e6edf3;border-top:1px solid #8886}
#consoledrawer.open{display:flex}
#cslbar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid #ffffff22;font-size:12px;flex:none;flex-wrap:wrap}
#cslbar .t{font-weight:700}
#cslstatus{flex:1;min-width:120px;opacity:.75;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cslbar button{border:1px solid #ffffff33;background:transparent;color:inherit;border-radius:6px;font-size:11px;padding:4px 9px;cursor:pointer;font-family:inherit}
#cslbar button:hover{background:#ffffff1a}
#cslgrab{flex:none;height:16px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;background:#ffffff10;border-bottom:1px solid #ffffff18}
#cslgrab:before{content:'';width:44px;height:4px;border-radius:2px;background:#ffffff44}
#cslgrab:hover:before{background:#ffffff88}
#cslpre{flex:1;overflow:auto;margin:0;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#menubtn{display:none;align-items:center;justify-content:center;width:30px;height:30px;margin-left:10px;border:1px solid #8884;border-radius:8px;background:transparent;color:inherit;cursor:pointer;padding:0;flex:none}
#menubtn:hover{background:#8882}
#menubtn svg{width:16px;height:16px}
@media(max-width:700px){
#menubtn{display:inline-flex}
.navlinks{display:none;position:absolute;top:100%;right:8px;flex-direction:column;align-items:stretch;background:Canvas;border:1px solid #8885;border-radius:12px;box-shadow:0 12px 32px #0006;z-index:210;min-width:170px;padding:6px;gap:0}
.navlinks.open{display:flex}
.navlinks a{margin:0!important;padding:10px 12px;border-radius:8px;font-size:14px!important;line-height:1.3}
.navlinks a:hover{background:#8882;text-decoration:none}
}
html[data-theme="dark"] .navlinks{background:#161c26;border-color:#ffffff22}
</style>

</head><body>
<header><h1><a href="/" style="color:inherit">Agent</a></h1><nav class="topnav"><div class="navlinks" id="sitenav"><a href="/">Chat</a><a href="/files" class="active">Files</a><a href="/functions">Functions</a><a href="/stats">Stats</a><a href="/docs">Docs</a><a href="/setup">Setup</a><a href="/update">Firmware</a></div><button id="menubtn" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sitenav" title="Menu"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button><button id="consolebtn" type="button" aria-label="Toggle console" title="Console logs">&gt;_</button><button id="themebtn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><svg class="moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><svg class="sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button></nav></header>
<div id="cmdbar">
  <button class="nbtn" id="back" title="Back">‹</button>
  <button class="nbtn" id="fwd" title="Forward">›</button>
  <button class="nbtn" id="up" title="Up one folder">⬆</button>
  <button class="nbtn" id="refresh" title="Refresh">⟳</button>

<div id="msg"></div>
<div id="explorer">
  <div id="sidebar">
    <h4>Quick access</h4>

  </div>
  <div id="main">
    <div id="listwrap"><table>
      <thead><tr>
        <th data-k="name">Name ⇅</th><th data-k="type">Type</th>
        <th data-k="mtime">Date modified</th><th data-k="size">Size</th><th>Actions</th>
      </tr></thead>

    </table></div>

    </div>
  </div>

</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="modalcard">
    <h3 id="mtitle"></h3>
    <p id="mtext"></p>
    <input id="minput" autocomplete="off" spellcheck="false" style="display:none"/>

  </div>
</div>
<script>
function tok(){try{return localStorage.getItem('esp32_token')||''}catch(e){return ''}}
function ah(h){h=h||{};var t=tok();if(t)h['Authorization']='Bearer '+t;return h}
var msgEl=document.getElementById('msg');
function say(m){msgEl.textContent=m||''}
/* ---------- modal dialogs (no native alert/confirm/prompt anywhere) ---------- */
var _mokcb=null;
function _mclose(v){document.getElementById('modal').classList.remove('open');
  document.getElementById('minput').value='';
  if(_mokcb){var f=_mokcb;_mokcb=null;f(v);}}
function modalShow(o){
  return new Promise(function(res){
    document.getElementById('mtitle').textContent=o.title||'';
    document.getElementById('mtext').textContent=o.text||'';
    var inp=document.getElementById('minput');
    if(o.prompt){inp.style.display='';inp.value=o.initial||'';}
    else inp.style.display='none';
    var ok=document.getElementById('mok');
    ok.textContent=o.okLabel||'OK';
    ok.className='tbtn'+(o.danger?' danger':'');
    _mokcb=res;
    document.getElementById('modal').classList.add('open');
    setTimeout(function(){(o.prompt?inp:ok).focus();if(o.prompt)inp.select();},30);
  });
}
function modalConfirm(title,text,o){o=o||{};
  return modalShow({title:title,text:text,okLabel:o.okLabel||'OK',danger:!!o.danger})
    .then(function(v){return v===true;});}
function modalPrompt(title,text,initial,o){o=o||{};
  return modalShow({title:title,text:text,prompt:true,initial:initial||'',okLabel:o.okLabel||'OK'});}
document.getElementById('mok').onclick=function(){
  var inp=document.getElementById('minput');
  _mclose(inp.style.display!=='none'?inp.value:true);};
document.getElementById('mcancel').onclick=function(){_mclose(null);};
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)_mclose(null);});
document.getElementById('minput').addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();document.getElementById('mok').click();}});
async function af(u,o){o=o||{};o.headers=ah(Object.assign({},o.headers||{}));var r=await fetch(u,o);
  if(r.status===401){say('Locked — enter the device password on the Chat or Setup page, then reload.');throw new Error('auth');}return r;}
/* ---------- state ---------- */
var cur='/',backStack=[],fwdStack=[],entries=[],sel=null;
var sortK='name',sortD=1;
var edPath=null,edDirty=false,edLang='txt';
/* ---------- helpers ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtSize(n){if(n==null||n==='')return '—';n=+n;if(!n)return '0 B';
  if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(2)+' MB';}
function fmtTime(t){if(!t)return '—';try{var d=new Date(t*1000);if(isNaN(d))return '—';
  return d.toLocaleString();}catch(e){return '—';}}
function ftype(name,isDir){if(isDir)return 'Folder';
  var i=name.lastIndexOf('.');var e=i>=0?name.slice(i+1).toLowerCase():'';
  return {py:'Python',html:'HTML',htm:'HTML',js:'JavaScript',css:'CSS',json:'JSON',txt:'Text',md:'Markdown',mpy:'Compiled Python',log:'Log'}[e]||(e?e.toUpperCase()+' file':'File');}
function ficon(name,isDir){if(isDir)return '📁';
  var i=name.lastIndexOf('.');var e=i>=0?name.slice(i+1).toLowerCase():'';
  if(e==='py')return '🐍';if(e==='html'||e==='htm')return '🌐';if(e==='js')return '📜';
  if(e==='css')return '🎨';if(e==='json')return '🧾';if(e==='txt'||e==='md')return '📝';
  if(e==='mpy')return '📦';return '📄';}
function editable(name){var i=name.lastIndexOf('.');var e=i>=0?name.slice(i+1).toLowerCase():'';
  return ['py','html','htm','js','css','json','txt','md','cfg','ini','log'].indexOf(e)>=0;}
/* ---------- syntax highlight (dependency-free) ---------- */
function tokenize(src,re,cls){var out='',last=0,m;re.lastIndex=0;
  while((m=re.exec(src))){out+=esc(src.slice(last,m.index));
    var c=cls(m);out+='<span class="'+c+'">'+esc(m[0])+'</span>';last=m.index+m[0].length;
    if(m[0].length===0){re.lastIndex++;}}
  return out+esc(src.slice(last));}
var PYKW='False|None|True|and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield';
var PYBI='print|len|range|str|int|float|bool|list|dict|tuple|set|open|super|self|cls|enumerate|zip|map|filter|sorted|reversed|min|max|sum|abs|round|isinstance|hasattr|getattr|setattr|Exception|ValueError|OSError|RuntimeError|TypeError|KeyError|IndexError';
var JSKW='break|case|catch|class|const|continue|debugger|default|delete|do|else|export|extends|finally|for|function|if|import|in|instanceof|let|new|return|super|switch|this|throw|try|typeof|var|void|while|with|yield|await|async|of|null|undefined|true|false';
function highlight(src,lang){
  var re,cls;
  if(lang==='py'){
    re=new RegExp("('''[\\s\\S]*?(?:'''|$)|\"\"\"[\\s\\S]*?(?:\"\"\"|$)|#[^\\n]*|'(?:\\\\.|[^'\\\\\\n])*'|\"(?:\\\\.|[^\"\\\\\\n])*\"|\\b\\d[\\d_]*(?:\\.\\d+)?\\b|\\b(?:"+PYKW+")\\b|\\b(?:"+PYBI+")\\b|@[A-Za-z_]\\w*)","g");
    var html=tokenize(src,re,function(m){var s=m[0];
      if(s[0]==='#')return 'tok-c';
      if(s[0]==="'"||s[0]==='"')return 'tok-s';

function sortedEntries(){
